<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <style>
      .box{rx:10;ry:10;stroke-width:1.5;}
      .t{font-size:13px;font-weight:600;fill:#1a1a2e;}
      .s{font-size:10.5px;fill:#5e5e5e;}
      .lane{font-size:11px;font-weight:700;fill:#6d28d9;letter-spacing:.05em;}
      .svc{fill:#faf7ff;stroke:#d8b4fe;}
      .ml{fill:#eff6ff;stroke:#93c5fd;}
      .gen{fill:#f0fdf4;stroke:#86efac;}
      .src{fill:#fffbeb;stroke:#fcd34d;}
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="56" fill="url(#hdr)"/>
  <text x="28" y="35" font-size="21" font-weight="700" fill="#fff">ShopSphere — Retail Personalization Engine · Reference Architecture</text>
  <text x="1152" y="35" font-size="12" fill="#e9d5ff" text-anchor="end">AWS me-central-1 (UAE)</text>

  <!-- Lane labels -->
  <text x="28" y="92" class="lane">1 · DATA SOURCES</text>
  <text x="28" y="212" class="lane">2 · LAKEHOUSE &amp; ETL</text>
  <text x="28" y="372" class="lane">3 · SERVING &amp; ML</text>
  <text x="28" y="512" class="lane">4 · PERSONALIZATION &amp; GENAI</text>

  <!-- Sources -->
  <g>
    <rect class="box src" x="28" y="104" width="190" height="70"/>
    <text x="44" y="130" class="t">Clickstream Events</text>
    <text x="44" y="150" class="s">web / app / mobile-web</text>
    <text x="44" y="165" class="s">64K+ events</text>

    <rect class="box src" x="238" y="104" width="190" height="70"/>
    <text x="254" y="130" class="t">Orders + Catalog</text>
    <text x="254" y="150" class="s">transactions, SKUs</text>
    <text x="254" y="165" class="s">line items, prices</text>

    <rect class="box src" x="448" y="104" width="190" height="70"/>
    <text x="464" y="130" class="t">Customer + Loyalty</text>
    <text x="464" y="150" class="s">profile, tier, language</text>
    <text x="464" y="165" class="s">AR / EN preference</text>
  </g>

  <!-- Lakehouse -->
  <rect class="box svc" x="28" y="224" width="150" height="68"/>
  <text x="44" y="250" class="t">Amazon S3</text>
  <text x="44" y="270" class="s">raw/ landing zone</text>

  <rect class="box svc" x="208" y="224" width="180" height="68"/>
  <text x="224" y="250" class="t">AWS Glue (PySpark)</text>
  <text x="224" y="270" class="s">sessionize + features</text>

  <rect class="box svc" x="418" y="224" width="220" height="68"/>
  <text x="434" y="246" class="t">Iceberg on Glue Catalog</text>
  <text x="434" y="264" class="s">Customer 360 · interactions</text>
  <text x="434" y="279" class="s">open format vs Databricks</text>

  <!-- Serving + ML -->
  <rect class="box svc" x="28" y="384" width="200" height="72"/>
  <text x="44" y="410" class="t">Redshift Serverless</text>
  <text x="44" y="430" class="s">serving layer (COPY)</text>
  <text x="44" y="445" class="s">Direct Query — no SPICE cap</text>

  <rect class="box ml" x="258" y="384" width="200" height="72"/>
  <text x="274" y="410" class="t">Redshift ML</text>
  <text x="274" y="430" class="s">next-best-product</text>
  <text x="274" y="445" class="s">propensity model</text>

  <rect class="box svc" x="488" y="384" width="200" height="72"/>
  <text x="504" y="410" class="t">Amazon QuickSight</text>
  <text x="504" y="430" class="s">personalization KPIs</text>
  <text x="504" y="445" class="s">conversion / AOV / ROI</text>

  <rect class="box ml" x="718" y="384" width="210" height="72"/>
  <text x="734" y="410" class="t">S3 Vectors</text>
  <text x="734" y="430" class="s">Titan embeddings</text>
  <text x="734" y="445" class="s">Bedrock KB alt (UAE)</text>

  <!-- GenAI -->
  <rect class="box gen" x="28" y="524" width="250" height="80"/>
  <text x="44" y="550" class="t">Bedrock AgentCore</text>
  <text x="44" y="570" class="s">Agentic Shopping Assistant</text>
  <text x="44" y="585" class="s">bilingual AR/EN · long-term memory</text>
  <text x="44" y="599" class="s">tool-use: search · reco · profile</text>

  <rect class="box gen" x="308" y="524" width="230" height="80"/>
  <text x="324" y="550" class="t">Amazon Bedrock LLM</text>
  <text x="324" y="570" class="s">Nova Pro / Claude</text>
  <text x="324" y="585" class="s">reasoning + response</text>
  <text x="324" y="599" class="s">brand voice</text>

  <rect class="box gen" x="568" y="524" width="230" height="80"/>
  <text x="584" y="550" class="t">Shopper Experience</text>
  <text x="584" y="570" class="s">rich product cards</text>
  <text x="584" y="585" class="s">multimodal + voice-ready</text>
  <text x="584" y="599" class="s">cart awareness</text>

  <!-- Arrows -->
  <g fill="none" stroke="#6b7280" stroke-width="1.6">
    <path d="M123,174 L103,224" marker-end="url(#arr)"/>
    <path d="M333,174 L303,224" marker-end="url(#arr)"/>
    <path d="M543,174 L528,224" marker-end="url(#arr)"/>
    <path d="M178,258 L208,258" marker-end="url(#arr)"/>
    <path d="M388,258 L418,258" marker-end="url(#arr)"/>
    <path d="M528,292 L128,384" marker-end="url(#arr)"/>
    <path d="M228,420 L258,420" marker-end="url(#arr)"/>
    <path d="M458,420 L488,420" marker-end="url(#arr)"/>
    <path d="M638,292 L820,384" marker-end="url(#arr)"/>
    <path d="M358,456 L153,524" marker-end="url(#arr)"/>
    <path d="M820,456 L200,524" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <path d="M278,564 L308,564" marker-end="url(#arr)"/>
    <path d="M538,564 L568,564" marker-end="url(#arr)"/>
  </g>

  <text x="950" y="540" class="s" fill="#9333ea" font-weight="700">5 Pillars (Coresight):</text>
  <text x="950" y="560" class="s">① Unified Intelligence  ② Next-Best-Action</text>
  <text x="950" y="576" class="s">③ Hyper-Personalized  ④ Real-Time Orchestration</text>
  <text x="950" y="592" class="s">⑤ Continuous Relationship</text>
</svg>
